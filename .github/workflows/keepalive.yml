name: Keep backend alive

on:
  schedule:
    # every 2 minutes
    - cron: '*/2 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl backend health endpoint (with retries)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing BACKEND_URL secret"; exit 1;
          fi
          TARGET="$BACKEND_URL/health"
          echo "Pinging $TARGET"
          n=0
          until [ $n -ge 3 ]
          do
            curl -fsS "$TARGET" && break
            n=$((n+1))
            echo "Attempt $n failed, retrying in 5s..."
            sleep 5
          done
          if [ $n -ge 3 ]; then
            echo "Health check failed after 3 attempts"; exit 1
          fi
