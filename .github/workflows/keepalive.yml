name: Keep backend alive

on:
  schedule:
    # every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing BACKEND_URL secret"; exit 1;
          fi
          echo "Pinging $BACKEND_URL/health"
          curl -fsS "$BACKEND_URL/health" || (echo "Health check failed"; exit 1)
